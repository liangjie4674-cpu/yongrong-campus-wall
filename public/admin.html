<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF5EC">
<title>永荣校园墙 · 管理后台</title>
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/styles.css">
<style>
  .admin-wrap{max-width:560px;margin:0 auto;padding:18px 14px 40px}
  .admin-wrap h1{font-family:"Noto Serif SC","Songti SC",serif;font-size:22px;font-weight:900;margin-bottom:4px}
  .admin-sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  .login-box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
  .login-box input{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:var(--bg);font-size:16px;outline:none;margin-bottom:12px}
  .login-box input:focus{border-color:var(--accent)}
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px}
  .stat-box{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
  .stat-box b{display:block;font-size:21px;font-variant-numeric:tabular-nums}
  .stat-box span{font-size:11.5px;color:var(--muted)}
  .admin-h{font-size:16px;font-weight:800;margin:20px 0 10px}
  .admin-h .badge{background:var(--accent);color:#fff;font-size:11.5px;border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:2px}
  .review-card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow)}
  .review-card .post-content{font-size:14.5px}
  .review-card.flagged{border-color:#F59E0B;background:color-mix(in srgb,#F59E0B 6%,var(--card))}
  .flag-note{font-size:12px;color:#B45309;font-weight:700;margin-top:6px}
  .review-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
  .btn{flex:1;padding:11px;border-radius:12px;font-size:14px;font-weight:700;min-height:44px}
  .btn-approve{background:#10B981;color:#fff}
  .btn-reject{background:var(--line);color:var(--ink)}
  .btn-delete{background:transparent;color:#DC2626;border:1px solid rgba(220,38,38,.35);flex:0 0 76px}
  .btn-pin{
    flex:0 0 auto;padding:11px 12px;font-size:13px;
    background:rgba(228,87,46,.1);color:var(--accent);border:1px solid rgba(228,87,46,.3);
  }
  .review-img{width:100%;max-height:320px;object-fit:cover;border-radius:12px;margin-top:9px;display:block;background:var(--line)}
  .approve-all{
    margin-left:8px;vertical-align:2px;padding:5px 11px;border-radius:999px;
    background:rgba(16,185,129,.12);color:#059669;border:1px solid rgba(16,185,129,.32);
    font-size:12px;font-weight:700;
  }
  .approve-all:disabled{opacity:.55}
  .none-note{color:var(--muted);font-size:13.5px;text-align:center;padding:16px 0}
  .logout{float:right;font-size:13px;color:var(--muted);font-weight:600;padding:6px 4px}
  .parent-content{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:9px;margin-bottom:8px;white-space:pre-wrap}
  .wait-badge{
    display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;
    font-size:11px;font-weight:700;color:#B45309;background:rgba(245,158,11,.14);
    vertical-align:1px;
  }
  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 12px 10px;margin:-8px 0 18px;box-shadow:var(--shadow)}
  .chart-title{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px}
  .daily-chart{display:flex;align-items:flex-end;gap:6px;height:118px}
  .chart-col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px}
  .chart-count{font-size:10.5px;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
  .chart-bar{width:100%;max-width:30px;min-height:4px;background:var(--accent);border-radius:4px 4px 2px 2px}
  .chart-date{font-size:10px;line-height:1;color:var(--muted);white-space:nowrap}
  .approved-search{
    width:100%;margin-bottom:10px;padding:11px 13px;border:1px solid var(--line);
    border-radius:12px;background:var(--bg);font-size:14px;outline:none;
  }
  .approved-search:focus{border-color:var(--accent)}
  .load-more{
    display:block;width:100%;margin-top:4px;padding:12px;border-radius:12px;
    background:var(--card);border:1px solid var(--line);color:var(--ink);
    font-size:14px;font-weight:700;box-shadow:var(--shadow);
  }
  .load-more:disabled{opacity:.6}
</style>
</head>
<body>
<div class="admin-wrap">
  <button class="logout" id="logoutBtn" hidden>退出登录</button>
  <h1>永荣校园墙 · 管理后台</h1>
  <p class="admin-sub">帖子与留言都要在这里审核通过，才会被大家看到。</p>

  <div class="login-box" id="loginBox">
    <input id="pwInput" type="password" placeholder="管理员密码" enterkeyhint="go" autocomplete="current-password">
    <button class="primary-btn" id="loginBtn" style="margin-top:0">登录</button>
  </div>

  <div id="panel" hidden>
    <div class="stats-grid" id="statsGrid"></div>

    <div class="login-box" style="margin-bottom:6px">
      <div style="font-weight:800;margin-bottom:8px">📢 公告（显示在墙面顶部，留空保存即撤下）</div>
      <input id="announceInput" type="text" maxlength="200" placeholder="例如：本周六运动会，投稿请注明班级">
      <div style="display:flex;gap:8px">
        <button class="primary-btn" id="announceSave" style="margin-top:0">保存公告</button>
        <button class="primary-btn" id="announceClear" style="margin-top:0;background:var(--line);color:var(--ink)">撤下公告</button>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-title">近 7 日发帖</div>
      <div class="daily-chart" id="dailyChart"></div>
    </div>

    <h2 class="admin-h">待审核帖子<span class="badge" id="pendingPostCount">0</span><button class="approve-all" id="approveAllBtn" hidden>全部通过</button></h2>
    <div id="pendingPosts"></div>

    <h2 class="admin-h">待审核留言<span class="badge" id="pendingCommentCount">0</span></h2>
    <div id="pendingComments"></div>

    <h2 class="admin-h">已上墙帖子</h2>
    <input class="approved-search" id="approvedSearch" type="search" placeholder="搜索已上墙帖子正文" autocomplete="off">
    <div id="approvedPosts"></div>
    <button class="load-more" id="loadMoreBtn" hidden>加载更多</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/admin.js"></script>
</body>
</html>
